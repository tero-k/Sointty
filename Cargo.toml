[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/core",
    "crates/decode",
    "crates/library",
    "crates/output-alsa",
    "crates/output-coreaudio",
    "crates/output-wasapi",
    "crates/playlist",
    "crates/source",
    "crates/tui",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tero-k/Sointty"

[workspace.dependencies]
sointty-core = { path = "crates/core" }
sointty-decode = { path = "crates/decode" }
sointty-source = { path = "crates/source" }
sointty-output-alsa = { path = "crates/output-alsa" }
sointty-output-wasapi = { path = "crates/output-wasapi" }
sointty-output-coreaudio = { path = "crates/output-coreaudio" }
sointty-playlist = { path = "crates/playlist" }
sointty-library = { path = "crates/library" }
sointty-tui = { path = "crates/tui" }
rtrb = "0.4.0"
crossbeam-channel = "0.5.17"
symphonia = { version = "0.6.1", features = ["aac", "aiff", "alac", "isomp4", "mp3"] }
alsa = "0.12.1"
windows = "0.62"
objc2-core-audio = "0.3.2"
audio_thread_priority = "0.38.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
directories = "6.0.0"
lofty = "0.25.4"
ogg = "0.9.2"
opus = "0.4.0"
block2 = "0.6"
objc2-foundation = "0.3"
rcue = "0.1.3"
quick-xml = "0.42.0"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["format"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
parking_lot = "0.12"

[profile.release]
lto = true
codegen-units = 1
